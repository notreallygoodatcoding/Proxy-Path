<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyPathz</title>
    <style>
        /* Reset margins and set the dark, space-themed background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0e27; /* Deep space blue/black background */
            color: #ffffff;
            text-align: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative dots background (starfield) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 60px 70px, #eee, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 50px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 10px, #eee, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 10px 90px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 130px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.8;
        }

        /* Ensure content appears above starfield */
        body > * {
            position: relative;
            z-index: 1;
        }

        /* The main container with your space style background */
        .hero-section {
            background: linear-gradient(rgba(10, 14, 39, 0.5), rgba(10, 14, 39, 0.95)), 
                        linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #1a237e 100%);
            background-size: auto;
            padding: 80px 20px;
            border-bottom: 3px solid #64b5f6;
            box-shadow: 0 0 30px rgba(100, 181, 246, 0.3);
        }

        /* Styling for the text elements with space theme */
        .countdown {
            color: #64b5f6;
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(100, 181, 246, 0.6);
        }

        .main-title {
            font-size: 5rem;
            font-weight: 300;
            margin: 0 0 30px 0;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(100, 181, 246, 0.5);
        }

        .announcement {
            font-size: 1.8rem;
            font-weight: 300;
            color: #b0bec5;
            max-width: 800px;
            margin: 0 auto 40px auto;
            line-height: 1.4;
        }

        .sub-time {
            font-size: 1.5rem;
            color: #64b5f6;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(100, 181, 246, 0.5);
        }

        /* Lower section for the main header */
        .footer-heading {
            margin-top: 60px;
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #64b5f6;
            text-shadow: 0 0 15px rgba(100, 181, 246, 0.4);
            padding: 20px;
        }

        .footer-heading::before {
            content: '◆ ';
            font-size: 0.8em;
            color: #90caf9;
        }

        .footer-heading::after {
            content: ' ◆';
            font-size: 0.8em;
            color: #90caf9;
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="countdown">✦ 24Hr left ✦</div>
        <h1 class="main-title">hi</h1>
        <p class="announcement">tomorrow there will be an improved app and version</p>
        <div class="sub-time">24Hr</div>
    </div>

    <h2 class="footer-heading">Proxy website</h2>

</body>
</html>
