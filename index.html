<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyPathz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Minimal grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(168, 85, 247, 0.05) 25%, rgba(168, 85, 247, 0.05) 26%, transparent 27%, transparent 74%, rgba(168, 85, 247, 0.05) 75%, rgba(168, 85, 247, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(168, 85, 247, 0.05) 25%, rgba(168, 85, 247, 0.05) 26%, transparent 27%, transparent 74%, rgba(168, 85, 247, 0.05) 75%, rgba(168, 85, 247, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        /* Staging Message */
        .staging-message {
            text-align: center;
            color: rgba(168, 85, 247, 0.6);
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: none;
        }

        .staging-message.show {
            display: block;
        }

        .staging-message h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #a855f7;
        }

        /* Hero Section */
        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            text-align: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            position: relative;
            width: 100%;
        }

        .hero-section.hidden {
            display: none;
        }

        .hero-content {
            max-width: 800px;
            position: relative;
            z-index: 2;
        }

        .hero-section .countdown {
            font-size: 0.9rem;
            color: #a855f7;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .hero-section .main-title {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -2px;
            line-height: 1.1;
        }

        .hero-section .announcement {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            color: #c0c0c0;
            font-weight: 400;
            margin-bottom: 60px;
            line-height: 1.5;
        }

        .hero-section .sub-time {
            font-size: 1.1rem;
            color: #a855f7;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .hero-section .footer-heading {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -1px;
            color: #ffffff;
        }

        /* Editable Text Styling */
        .editable-text {
            transition: all 0.2s ease;
            cursor: default;
        }

        .edit-mode .editable-text {
            border: 2px dashed rgba(168, 85, 247, 0.4);
            padding: 4px 8px;
            cursor: text;
            border-radius: 4px;
        }

        .edit-mode .editable-text:hover {
            background-color: rgba(168, 85, 247, 0.05);
            border-color: rgba(168, 85, 247, 0.8);
        }

        /* Developer Badge */
        .developer-badge {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 50px;
            display: none;
            z-index: 900;
            box-shadow: 0 8px 32px rgba(168, 85, 247, 0.2);
            font-weight: 600;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .developer-badge.active {
            display: flex;
        }

        .badge-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer-display {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffd700;
            min-width: 70px;
            font-family: 'Courier New', monospace;
        }

        .badge-toggle {
            font-size: 1.2rem;
            user-select: none;
            margin-left: 5px;
        }

        /* Developer Panel */
        .developer-panel {
            position: fixed;
            bottom: 100px;
            right: -420px;
            width: 400px;
            max-height: 70vh;
            background: rgba(13, 6, 20, 0.95);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            z-index: 890;
            transition: right 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .developer-panel.open {
            right: 30px;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .panel-header h2 {
            margin: 0;
            color: #a855f7;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .close-btn {
            background: none;
            border: none;
            color: #a855f7;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .close-btn:hover {
            background-color: rgba(168, 85, 247, 0.1);
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-section label {
            color: #a855f7;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .switch {
            position: relative;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(168, 85, 247, 0.2);
            border-radius: 24px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            transition: 0.3s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #a855f7;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked + .slider {
            background-color: #a855f7;
            border-color: #a855f7;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
            background-color: #0a0a0a;
        }

        .shape-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .shape-btn {
            padding: 12px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #a855f7;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .shape-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: #a855f7;
        }

        .shape-btn:active {
            transform: scale(0.95);
        }

        .color-picker-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .color-picker-group input[type="color"] {
            width: 48px;
            height: 40px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 6px;
            cursor: pointer;
            background-color: #a855f7;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #a855f7;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .file-input-label:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: #a855f7;
        }

        .edit-button, .finish-button, .copy-button {
            padding: 12px;
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            border: 1px solid #a855f7;
            color: #0a0a0a;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.2s;
            margin-top: auto;
        }

        .edit-button:hover, .finish-button:hover, .copy-button:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }

        .edit-button:active, .finish-button:active, .copy-button:active {
            transform: translateY(0);
        }

        /* Edit Mode */
        .edit-mode {
            position: relative;
        }

        .editable-element {
            position: absolute;
            border: 2px dashed rgba(168, 85, 247, 0.5);
            cursor: move;
            touch-action: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .editable-element.selected {
            border: 2px solid #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .resize-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #a855f7;
            border: 1px solid #0a0a0a;
            border-radius: 50%;
            cursor: nwse-resize;
        }

        .resize-handle.tl { top: -4px; left: -4px; cursor: nw-resize; }
        .resize-handle.tr { top: -4px; right: -4px; cursor: ne-resize; }
        .resize-handle.bl { bottom: -4px; left: -4px; cursor: sw-resize; }
        .resize-handle.br { bottom: -4px; right: -4px; cursor: se-resize; }

        /* Code Modal */
        .code-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .code-modal.active {
            display: flex;
        }

        .code-container {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            max-width: 900px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        .code-header {
            padding: 20px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-header h3 {
            color: #a855f7;
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .code-close {
            background: none;
            border: none;
            color: #a855f7;
            font-size: 1.5rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .code-close:hover {
            background-color: rgba(168, 85, 247, 0.1);
        }

        .code-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .code-display {
            background: #000000;
            border: 1px solid rgba(168, 85, 247, 0.2);
            padding: 20px;
            border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
            color: #a855f7;
            font-size: 0.85rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 100%;
            overflow-y: auto;
        }

        .code-footer {
            padding: 20px;
            border-top: 1px solid rgba(168, 85, 247, 0.2);
            display: flex;
            gap: 12px;
        }

        .copy-button {
            flex: 1;
            margin: 0;
        }

        /* Login Panel */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            backdrop-filter: blur(4px);
        }

        .login-overlay.active {
            display: flex;
            opacity: 1;
        }

        .login-panel {
            background: rgba(13, 6, 20, 0.95);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            width: 90%;
            max-width: 400px;
            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-panel h2 {
            color: #a855f7;
            margin: 0 0 30px 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #a855f7;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            background-color: rgba(168, 85, 247, 0.05);
            color: #a855f7;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            border-color: #a855f7;
            background-color: rgba(168, 85, 247, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(168, 85, 247, 0.5);
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            color: #0a0a0a;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
        }

        .login-button:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }

        .error-message {
            color: #ff4444;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .error-message.show {
            display: block;
        }

        /* Scrollbar Styling */
        .panel-content::-webkit-scrollbar,
        .code-display::-webkit-scrollbar {
            width: 6px;
        }

        .panel-content::-webkit-scrollbar-track,
        .code-display::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-content::-webkit-scrollbar-thumb,
        .code-display::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.3);
            border-radius: 3px;
        }

        .panel-content::-webkit-scrollbar-thumb:hover,
        .code-display::-webkit-scrollbar-thumb:hover {
            background: rgba(168, 85, 247, 0.6);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .developer-panel {
                width: 100%;
                right: -100%;
                border-radius: 12px 12px 0 0;
            }

            .developer-panel.open {
                right: 0;
            }

            .developer-badge {
                bottom: 20px;
                right: 20px;
                padding: 10px 16px;
                font-size: 0.8rem;
            }

            .hero-section .main-title {
                font-size: 2.5rem;
            }

            .hero-section .announcement {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Staging Message (shown when not logged in) -->
    <div class="staging-message" id="stagingMessage">
        <h3>Stage 1 - Developer Only</h3>
        <p>ProxyPathz is in early testing. Access for developers only.</p>
    </div>

    <!-- Developer Badge -->
    <div class="developer-badge" id="developerBadge">
        <span class="badge-label">Build</span>
        <span class="timer-display" id="timerDisplay">10:00:00</span>
        <span class="badge-toggle" id="badgeToggle">></span>
    </div>

    <!-- Developer Panel -->
    <div class="developer-panel" id="developerPanel">
        <div class="panel-header">
            <h2>Build Tools</h2>
            <button class="close-btn" id="closePanel">×</button>
        </div>
        <div class="panel-content">
            <div class="panel-section">
                <label>Grid Snap</label>
                <div class="toggle-switch">
                    <label class="switch">
                        <input type="checkbox" id="gridSnapToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="panel-section">
                <label>Add Element</label>
                <div class="shape-grid">
                    <button class="shape-btn" data-shape="rectangle">Rectangle</button>
                    <button class="shape-btn" data-shape="circle">Circle</button>
                    <button class="shape-btn" data-shape="text">Text</button>
                    <button class="shape-btn" data-shape="button">Button</button>
                </div>
            </div>

            <div class="panel-section">
                <label>Color</label>
                <div class="color-picker-group">
                    <input type="color" id="shapeColor" value="#a855f7">
                </div>
            </div>

            <div class="panel-section">
                <label>Image</label>
                <div class="file-input-wrapper">
                    <input type="file" id="imageInput" accept="image/*">
                    <label for="imageInput" class="file-input-label">Upload</label>
                </div>
            </div>

            <button class="edit-button" id="editModeBtn">Enter Edit</button>
            <button class="finish-button" id="finishBtn" style="display: none;">Export Code</button>
        </div>
    </div>

    <!-- Code Modal -->
    <div class="code-modal" id="codeModal">
        <div class="code-container">
            <div class="code-header">
                <h3>Your Code</h3>
                <button class="code-close" id="closeCode">×</button>
            </div>
            <div class="code-content">
                <div class="code-display" id="codeDisplay"></div>
            </div>
            <div class="code-footer">
                <button class="copy-button" id="copyCodeBtn">Copy Code</button>
            </div>
        </div>
    </div>

    <!-- Login Panel -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-panel">
            <h2>Developer</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="login-button">Login</button>
                <div class="error-message" id="errorMessage">Invalid credentials</div>
            </form>
        </div>
    </div>

    <!-- Hero Section (only shows when logged in as developer) -->
    <div class="hero-section hidden" id="heroSection">
        <div class="hero-content">
            <div class="countdown editable-text" contenteditable="false">24 Hours</div>
            <h1 class="main-title editable-text" contenteditable="false">ProxyPathz</h1>
            <p class="announcement editable-text" contenteditable="false">Build websites your way. No limits, no templates.</p>
            <div class="sub-time editable-text" contenteditable="false">Coming Soon</div>
            <h2 class="footer-heading editable-text" contenteditable="false">Build</h2>
        </div>
    </div>

    <script>
        const TRIGGER_CODE = "1991";
        const DEVELOPER_USERNAME = "X4ZQ3";
        const DEVELOPER_PASSWORD = "beta tester";
        const SESSION_DURATION = 10 * 60 * 60 * 1000;
        const RESET_DELAY = 5000;

        const loginOverlay = document.getElementById('loginOverlay');
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const developerBadge = document.getElementById('developerBadge');
        const timerDisplay = document.getElementById('timerDisplay');
        const badgeToggle = document.getElementById('badgeToggle');
        const developerPanel = document.getElementById('developerPanel');
        const closePanel = document.getElementById('closePanel');
        const editModeBtn = document.getElementById('editModeBtn');
        const finishBtn = document.getElementById('finishBtn');
        const heroSection = document.getElementById('heroSection');
        const stagingMessage = document.getElementById('stagingMessage');
        const codeModal = document.getElementById('codeModal');
        const codeDisplay = document.getElementById('codeDisplay');
        const closeCode = document.getElementById('closeCode');
        const copyCodeBtn = document.getElementById('copyCodeBtn');
        const gridSnapToggle = document.getElementById('gridSnapToggle');
        const shapeColor = document.getElementById('shapeColor');
        const imageInput = document.getElementById('imageInput');

        let triggerBuffer = "";
        let resetTimer = null;
        let editMode = false;
        let selectedElement = null;
        let uploadedImage = null;
        const GRID_SIZE = 10;

        // Trigger code detection
        document.addEventListener('keydown', function(e) {
            if (e.key.length === 1) {
                triggerBuffer += e.key;
                
                if (resetTimer) {
                    clearTimeout(resetTimer);
                }

                resetTimer = setTimeout(() => {
                    triggerBuffer = "";
                }, RESET_DELAY);

                if (triggerBuffer.length > TRIGGER_CODE.length) {
                    triggerBuffer = triggerBuffer.slice(-TRIGGER_CODE.length);
                }

                if (triggerBuffer.includes(TRIGGER_CODE)) {
                    showLoginPanel();
                    triggerBuffer = "";
                    if (resetTimer) {
                        clearTimeout(resetTimer);
                    }
                }
            }
        });

        function showLoginPanel() {
            loginOverlay.classList.add('active');
            usernameInput.focus();
            errorMessage.classList.remove('show');
            usernameInput.value = '';
            passwordInput.value = '';
        }

        // Login
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (username === DEVELOPER_USERNAME && password === DEVELOPER_PASSWORD) {
                errorMessage.classList.remove('show');
                loginOverlay.classList.remove('active');
                developerBadge.classList.add('active');
                stagingMessage.classList.remove('show');
                heroSection.classList.remove('hidden');
                
                const sessionStartTime = Date.now();
                localStorage.setItem('developerSessionStart', sessionStartTime);
                startCountdownTimer();
                loginForm.reset();
            } else {
                errorMessage.classList.add('show');
                passwordInput.value = '';
                usernameInput.focus();
            }
        });

        // Panel toggle
        badgeToggle.addEventListener('click', function() {
            developerPanel.classList.toggle('open');
            badgeToggle.textContent = developerPanel.classList.contains('open') ? '<' : '>';
        });

        closePanel.addEventListener('click', function() {
            developerPanel.classList.remove('open');
            badgeToggle.textContent = '>';
        });

        // Timer
        function startCountdownTimer() {
            const updateTimer = function() {
                const sessionStartTime = parseInt(localStorage.getItem('developerSessionStart'));
                const elapsedTime = Date.now() - sessionStartTime;
                const remainingTime = SESSION_DURATION - elapsedTime;

                if (remainingTime <= 0) {
                    developerBadge.classList.remove('active');
                    localStorage.removeItem('developerSessionStart');
                    timerDisplay.textContent = '00:00:00';
                    heroSection.classList.add('hidden');
                    stagingMessage.classList.add('show');
                    clearInterval(timerInterval);
                } else {
                    const hours = Math.floor(remainingTime / (1000 * 60 * 60));
                    const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);
                    timerDisplay.textContent = 
                        String(hours).padStart(2, '0') + ':' + 
                        String(minutes).padStart(2, '0') + ':' + 
                        String(seconds).padStart(2, '0');
                }
            };
            updateTimer();
            const timerInterval = setInterval(updateTimer, 1000);
        }

        // Check session on load
        window.addEventListener('load', function() {
            const sessionStartTime = localStorage.getItem('developerSessionStart');
            if (sessionStartTime) {
                const sessionStart = parseInt(sessionStartTime);
                const elapsedTime = Date.now() - sessionStart;
                if (elapsedTime < SESSION_DURATION) {
                    developerBadge.classList.add('active');
                    stagingMessage.classList.remove('show');
                    heroSection.classList.remove('hidden');
                    startCountdownTimer();
                } else {
                    localStorage.removeItem('developerSessionStart');
                    stagingMessage.classList.add('show');
                    heroSection.classList.add('hidden');
                }
            } else {
                stagingMessage.classList.add('show');
                heroSection.classList.add('hidden');
            }
        });

        // Edit mode
        editModeBtn.addEventListener('click', function() {
            editMode = true;
            heroSection.style.position = 'relative';
            heroSection.classList.add('edit-mode');
            
            document.querySelectorAll('.editable-text').forEach(el => {
                el.contentEditable = true;
            });
            
            editModeBtn.style.display = 'none';
            finishBtn.style.display = 'block';
        });

        // Shape buttons
        document.querySelectorAll('[data-shape]').forEach(btn => {
            btn.addEventListener('click', function() {
                if (!editMode) return;
                const shape = this.dataset.shape;
                createShape(shape);
            });
        });

        function createShape(type) {
            const element = document.createElement('div');
            element.className = 'editable-element selected';
            element.style.left = '100px';
            element.style.top = '100px';
            element.style.width = '120px';
            element.style.height = '120px';
            element.style.backgroundColor = shapeColor.value;
            element.style.position = 'absolute';
            element.style.zIndex = '10';

            if (type === 'circle') {
                element.style.borderRadius = '50%';
            } else if (type === 'text') {
                element.textContent = 'Text';
                element.style.color = '#ffffff';
                element.style.display = 'flex';
                element.style.alignItems = 'center';
                element.style.justifyContent = 'center';
                element.style.fontSize = '14px';
                element.style.fontWeight = '600';
                element.contentEditable = true;
            } else if (type === 'button') {
                element.textContent = 'Button';
                element.style.cursor = 'pointer';
                element.style.display = 'flex';
                element.style.alignItems = 'center';
                element.style.justifyContent = 'center';
                element.style.color = '#0a0a0a';
                element.style.border = 'none';
                element.style.borderRadius = '6px';
                element.style.fontWeight = '600';
                element.style.fontSize = '14px';
                if (uploadedImage) {
                    element.style.backgroundImage = `url(${uploadedImage})`;
                    element.style.backgroundSize = 'cover';
                }
            }

            ['tl', 'tr', 'bl', 'br'].forEach(pos => {
                const handle = document.createElement('div');
                handle.className = `resize-handle ${pos}`;
                element.appendChild(handle);
            });

            element.addEventListener('mousedown', selectElement);
            heroSection.appendChild(element);
            selectedElement = element;
        }

        function selectElement(e) {
            if (!editMode) return;
            
            const clickedElement = e.target.closest('.editable-element');
            if (!clickedElement) return;
            
            selectedElement = clickedElement;
            document.querySelectorAll('.editable-element').forEach(el => el.classList.remove('selected'));
            selectedElement.classList.add('selected');

            if (e.target.classList.contains('resize-handle')) {
                const startX = e.clientX;
                const startY = e.clientY;
                const startWidth = selectedElement.offsetWidth;
                const startHeight = selectedElement.offsetHeight;
                const pos = e.target.className.split(' ')[1];

                function onMouseMove(e) {
                    const deltaX = e.clientX - startX;
                    const deltaY = e.clientY - startY;

                    if (pos.includes('r')) {
                        let newWidth = startWidth + deltaX;
                        if (gridSnapToggle.checked) newWidth = Math.round(newWidth / GRID_SIZE) * GRID_SIZE;
                        selectedElement.style.width = Math.max(50, newWidth) + 'px';
                    }
                    if (pos.includes('b')) {
                        let newHeight = startHeight + deltaY;
                        if (gridSnapToggle.checked) newHeight = Math.round(newHeight / GRID_SIZE) * GRID_SIZE;
                        selectedElement.style.height = Math.max(50, newHeight) + 'px';
                    }
                }

                function onMouseUp() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                e.preventDefault();
            } else {
                const startX = e.clientX;
                const startY = e.clientY;
                const startLeft = selectedElement.offsetLeft;
                const startTop = selectedElement.offsetTop;

                function onMouseMove(e) {
                    let newLeft = startLeft + (e.clientX - startX);
                    let newTop = startTop + (e.clientY - startY);

                    if (gridSnapToggle.checked) {
                        newLeft = Math.round(newLeft / GRID_SIZE) * GRID_SIZE;
                        newTop = Math.round(newTop / GRID_SIZE) * GRID_SIZE;
                    }

                    selectedElement.style.left = newLeft + 'px';
                    selectedElement.style.top = newTop + 'px';
                }

                function onMouseUp() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                e.preventDefault();
            }
        }

        // Image upload
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImage = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Finish
        finishBtn.addEventListener('click', function() {
            editMode = false;
            heroSection.classList.remove('edit-mode');
            
            document.querySelectorAll('.editable-text').forEach(el => {
                el.contentEditable = false;
            });
            
            document.querySelectorAll('.editable-element').forEach(el => {
                el.classList.remove('selected');
            });
            
            editModeBtn.style.display = 'block';
            finishBtn.style.display = 'none';

            const htmlCode = heroSection.innerHTML;
            codeDisplay.textContent = htmlCode;
            codeModal.classList.add('active');
        });

        closeCode.addEventListener('click', function() {
            codeModal.classList.remove('active');
        });

        copyCodeBtn.addEventListener('click', function() {
            const code = codeDisplay.textContent;
            navigator.clipboard.writeText(code).then(() => {
                copyCodeBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyCodeBtn.textContent = 'Copy Code';
                }, 2000);
            });
        });
    </script>

</body>
</html>
