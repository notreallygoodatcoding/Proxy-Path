<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyPathz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Minimal grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(168, 85, 247, 0.05) 25%, rgba(168, 85, 247, 0.05) 26%, transparent 27%, transparent 74%, rgba(168, 85, 247, 0.05) 75%, rgba(168, 85, 247, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(168, 85, 247, 0.05) 25%, rgba(168, 85, 247, 0.05) 26%, transparent 27%, transparent 74%, rgba(168, 85, 247, 0.05) 75%, rgba(168, 85, 247, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        /* Staging Message */
        .staging-message {
            text-align: center;
            color: rgba(168, 85, 247, 0.6);
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: none;
        }

        .staging-message.show {
            display: block;
        }

        .staging-message h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #a855f7;
        }

        /* Hero Section */
        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            text-align: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            position: relative;
            width: 100%;
        }

        .hero-section.hidden {
            display: none;
        }

        .hero-content {
            max-width: 800px;
            position: relative;
            z-index: 2;
        }

        .hero-section .countdown {
            font-size: 0.9rem;
            color: #a855f7;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .hero-section .main-title {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -2px;
            line-height: 1.1;
        }

        .hero-section .announcement {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            color: #c0c0c0;
            font-weight: 400;
            margin-bottom: 60px;
            line-height: 1.5;
        }

        .hero-section .sub-time {
            font-size: 1.1rem;
            color: #a855f7;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .hero-section .footer-heading {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -1px;
            color: #ffffff;
        }

        /* Editable Text Styling */
        .editable-text {
            transition: all 0.2s ease;
            cursor: default;
        }

        .edit-mode .editable-text {
            border: 2px dashed rgba(168, 85, 247, 0.4);
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
        }

        .edit-mode .editable-text:hover {
            background-color: rgba(168, 85, 247, 0.05);
            border-color: rgba(168, 85, 247, 0.8);
        }

        /* Developer Badge */
        .developer-badge {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 50px;
            display: none;
            z-index: 900;
            box-shadow: 0 8px 32px rgba(168, 85, 247, 0.2);
            font-weight: 600;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .developer-badge.active {
            display: flex;
        }

        .badge-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer-display {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffd700;
            min-width: 70px;
            font-family: 'Courier New', monospace;
        }

        .badge-toggle {
            font-size: 1.2rem;
            user-select: none;
            margin-left: 5px;
        }

        /* Developer Panel */
        .developer-panel {
            position: fixed;
            bottom: 100px;
            right: -420px;
            width: 400px;
            max-height: 70vh;
            background: rgba(13, 6, 20, 0.95);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            z-index: 890;
            transition: right 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .developer-panel.open {
            right: 30px;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .panel-header h2 {
            margin: 0;
            color: #a855f7;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .close-btn {
            background: none;
            border: none;
            color: #a855f7;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .close-btn:hover {
            background-color: rgba(168, 85, 247, 0.1);
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-section label {
            color: #a855f7;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .switch {
            position: relative;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(168, 85, 247, 0.2);
            border-radius: 24px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            transition: 0.3s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #a855f7;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked + .slider {
            background-color: #a855f7;
            border-color: #a855f7;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
            background-color: #0a0a0a;
        }

        .shape-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .shape-btn {
            padding: 12px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #a855f7;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .shape-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: #a855f7;
        }

        .shape-btn:active {
            transform: scale(0.95);
        }

        .color-picker-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .color-picker-group input[type="color"] {
            width: 48px;
            height: 40px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 6px;
            cursor: pointer;
            background-color: #a855f7;
        }

        .edit-button, .finish-button, .copy-button {
            padding: 12px;
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            border: 1px solid #a855f7;
            color: #0a0a0a;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.2s;
            margin-top: auto;
        }

        .edit-button:hover, .finish-button:hover, .copy-button:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }

        .edit-button:active, .finish-button:active, .copy-button:active {
            transform: translateY(0);
        }

        /* Edit Mode */
        .edit-mode {
            position: relative;
        }

        .editable-element {
            position: absolute;
            border: 2px dashed rgba(168, 85, 247, 0.5);
            cursor: move;
            touch-action: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .editable-element.selected {
            border: 2px solid #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .resize-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #a855f7;
            border: 1px solid #0a0a0a;
            border-radius: 50%;
            cursor: nwse-resize;
            display: none;
        }

        .editable-element.selected .resize-handle {
            display: block;
        }

        .resize-handle.tl { top: -4px; left: -4px; cursor: nw-resize; }
        .resize-handle.tr { top: -4px; right: -4px; cursor: ne-resize; }
        .resize-handle.bl { bottom: -4px; left: -4px; cursor: sw-resize; }
        .resize-handle.br { bottom: -4px; right: -4px; cursor: se-resize; }

        /* Element context menu (opens on double-click) */
        .element-menu {
            position: fixed;
            background: rgba(13, 6, 20, 0.98);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 8px;
            padding: 14px;
            z-index: 950;
            display: none;
            flex-direction: column;
            gap: 10px;
            min-width: 210px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        .element-menu.active {
            display: flex;
        }

        .element-menu-title {
            color: #a855f7;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            opacity: 0.8;
        }

        .element-menu button {
            padding: 9px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #a855f7;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .element-menu button:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: #a855f7;
        }

        .element-menu button.danger {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.4);
        }

        .element-menu button.danger:hover {
            background: rgba(255, 107, 107, 0.15);
            border-color: #ff6b6b;
        }

        .element-menu button.done-btn {
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            color: #0a0a0a;
            border: none;
        }

        .element-menu .transparency-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .element-menu .transparency-row label {
            color: #a855f7;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .element-menu input[type="range"] {
            width: 100%;
            accent-color: #a855f7;
        }

        .element-menu input[type="color"] {
            width: 100%;
            height: 36px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }

        .element-menu input[type="number"],
        .element-menu input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            background-color: rgba(168, 85, 247, 0.05);
            color: #a855f7;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        /* Tab Overlay - opened by a Button shape set to "New Tab" mode */
        .tab-overlay {
            display: none;
            position: fixed;
            top: 40px;
            left: 40px;
            right: 40px;
            bottom: 40px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            z-index: 850;
            overflow: auto;
        }

        .tab-overlay.active {
            display: block;
        }

        .tab-canvas {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 400px;
        }

        .tab-close-btn {
            position: fixed;
            top: 52px;
            right: 52px;
            width: 32px;
            height: 32px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #a855f7;
            border-radius: 6px;
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
            z-index: 851;
        }

        .tab-close-btn:hover {
            background: rgba(168, 85, 247, 0.3);
        }

        .element-menu .layer-row {
            display: flex;
            gap: 8px;
        }

        .element-menu .layer-row button {
            flex: 1;
        }

        /* Code Modal */
        .code-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .code-modal.active {
            display: flex;
        }

        .code-container {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            max-width: 900px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        .code-header {
            padding: 20px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-header h3 {
            color: #a855f7;
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .code-close {
            background: none;
            border: none;
            color: #a855f7;
            font-size: 1.5rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .code-close:hover {
            background-color: rgba(168, 85, 247, 0.1);
        }

        .code-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .code-display {
            background: #000000;
            border: 1px solid rgba(168, 85, 247, 0.2);
            padding: 20px;
            border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
            color: #a855f7;
            font-size: 0.85rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 100%;
            overflow-y: auto;
        }

        .code-footer {
            padding: 20px;
            border-top: 1px solid rgba(168, 85, 247, 0.2);
            display: flex;
            gap: 12px;
        }

        .copy-button {
            flex: 1;
            margin: 0;
        }

        /* Login Panel */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            backdrop-filter: blur(4px);
        }

        .login-overlay.active {
            display: flex;
            opacity: 1;
        }

        .login-panel {
            background: rgba(13, 6, 20, 0.95);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            width: 90%;
            max-width: 400px;
            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-panel h2 {
            color: #a855f7;
            margin: 0 0 30px 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #a855f7;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            background-color: rgba(168, 85, 247, 0.05);
            color: #a855f7;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            border-color: #a855f7;
            background-color: rgba(168, 85, 247, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(168, 85, 247, 0.5);
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            color: #0a0a0a;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
        }

        .login-button:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }

        .error-message {
            color: #ff4444;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .error-message.show {
            display: block;
        }

        /* Scrollbar Styling */
        .panel-content::-webkit-scrollbar,
        .code-display::-webkit-scrollbar {
            width: 6px;
        }

        .panel-content::-webkit-scrollbar-track,
        .code-display::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-content::-webkit-scrollbar-thumb,
        .code-display::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.3);
            border-radius: 3px;
        }

        .panel-content::-webkit-scrollbar-thumb:hover,
        .code-display::-webkit-scrollbar-thumb:hover {
            background: rgba(168, 85, 247, 0.6);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .developer-panel {
                width: 100%;
                right: -100%;
                border-radius: 12px 12px 0 0;
            }

            .developer-panel.open {
                right: 0;
            }

            .developer-badge {
                bottom: 20px;
                right: 20px;
                padding: 10px 16px;
                font-size: 0.8rem;
            }

            .hero-section .main-title {
                font-size: 2.5rem;
            }

            .hero-section .announcement {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Staging Message (shown when not logged in) -->
    <div class="staging-message" id="stagingMessage">
        <h3>Stage 1 - Developer Only</h3>
        <p>ProxyPathz is in early testing. Access for developers only.</p>
    </div>

    <!-- Developer Badge -->
    <div class="developer-badge" id="developerBadge">
        <span class="badge-label">Build</span>
        <span class="timer-display" id="timerDisplay">10:00:00</span>
        <span class="badge-toggle" id="badgeToggle">></span>
    </div>

    <!-- Developer Panel -->
    <div class="developer-panel" id="developerPanel">
        <div class="panel-header">
            <h2>Build Tools</h2>
            <button class="close-btn" id="closePanel">×</button>
        </div>
        <div class="panel-content">
            <div class="panel-section">
                <label>Grid Snap</label>
                <div class="toggle-switch">
                    <label class="switch">
                        <input type="checkbox" id="gridSnapToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="panel-section">
                <label>Add Element</label>
                <div class="shape-grid">
                    <button class="shape-btn" data-shape="rectangle">Rectangle</button>
                    <button class="shape-btn" data-shape="circle">Circle</button>
                    <button class="shape-btn" data-shape="text">Text</button>
                    <button class="shape-btn" data-shape="button">Button</button>
                </div>
            </div>

            <div class="panel-section">
                <label>Color</label>
                <div class="color-picker-group">
                    <input type="color" id="shapeColor" value="#a855f7">
                </div>
            </div>

            <button class="edit-button" id="editModeBtn">Enter Edit</button>
            <button class="finish-button" id="finishBtn" style="display: none;">Export Code</button>
        </div>
    </div>

    <!-- Element context menu: opens on double-click of any shape or text -->
    <div class="element-menu" id="elementMenu"></div>

    <!-- Tab Overlay: opened by a Button shape set to "New Tab" mode. Add Element
         while this is open adds into here instead of the main page; the X returns
         you to editing the main page. -->
    <div class="tab-overlay" id="tabOverlay">
        <button class="tab-close-btn" id="tabCloseBtn">×</button>
        <div class="tab-canvas" id="tabCanvas"></div>
    </div>

    <!-- Code Modal -->
    <div class="code-modal" id="codeModal">
        <div class="code-container">
            <div class="code-header">
                <h3>Your Code</h3>
                <button class="code-close" id="closeCode">×</button>
            </div>
            <div class="code-content">
                <div class="code-display" id="codeDisplay"></div>
            </div>
            <div class="code-footer">
                <button class="copy-button" id="copyCodeBtn">Copy Code</button>
            </div>
        </div>
    </div>

    <!-- Login Panel -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-panel">
            <h2>Developer</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="login-button">Login</button>
                <div class="error-message" id="errorMessage">Invalid credentials</div>
            </form>
        </div>
    </div>

    <!-- Hero Section (only shows when logged in as developer) -->
    <div class="hero-section hidden" id="heroSection">
        <div class="hero-content">
            <div class="countdown editable-text" contenteditable="false">24 Hours</div>
            <h1 class="main-title editable-text" contenteditable="false">ProxyPathz</h1>
            <p class="announcement editable-text" contenteditable="false">Build websites your way. No limits, no templates.</p>
            <div class="sub-time editable-text" contenteditable="false">Coming Soon</div>
            <h2 class="footer-heading editable-text" contenteditable="false">Build</h2>
        </div>
    </div>

    <!-- Hidden file input used by the double-click "Upload Image" menu action -->
    <input type="file" id="elementImageInput" accept="image/*" style="display:none">

    <script>
        const TRIGGER_CODE = "1991";
        const DEVELOPER_USERNAME = "X4ZQ3";
        const DEVELOPER_PASSWORD = "beta tester";
        const SESSION_DURATION = 10 * 60 * 60 * 1000;
        const RESET_DELAY = 5000;

        const loginOverlay = document.getElementById('loginOverlay');
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const developerBadge = document.getElementById('developerBadge');
        const timerDisplay = document.getElementById('timerDisplay');
        const badgeToggle = document.getElementById('badgeToggle');
        const developerPanel = document.getElementById('developerPanel');
        const closePanel = document.getElementById('closePanel');
        const editModeBtn = document.getElementById('editModeBtn');
        const finishBtn = document.getElementById('finishBtn');
        const heroSection = document.getElementById('heroSection');
        const stagingMessage = document.getElementById('stagingMessage');
        const codeModal = document.getElementById('codeModal');
        const codeDisplay = document.getElementById('codeDisplay');
        const closeCode = document.getElementById('closeCode');
        const copyCodeBtn = document.getElementById('copyCodeBtn');
        const gridSnapToggle = document.getElementById('gridSnapToggle');
        const shapeColor = document.getElementById('shapeColor');
        const elementMenu = document.getElementById('elementMenu');
        const elementImageInput = document.getElementById('elementImageInput');
        const tabOverlay = document.getElementById('tabOverlay');
        const tabCanvas = document.getElementById('tabCanvas');
        const tabCloseBtn = document.getElementById('tabCloseBtn');

        let activeCanvas = null; // set to heroSection once edit mode starts; Add Element targets whichever canvas is active

        tabCloseBtn.addEventListener('click', function() {
            tabOverlay.classList.remove('active');
            activeCanvas = heroSection;
        });

        // Clicking a Button shape set to "New Tab" mode opens the tab overlay as its
        // own canvas - this works even while editing, since that's how you add
        // content into it. A Button with a link only navigates on the live page
        // (outside edit mode), so it doesn't yank you away while you're editing.
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('[data-shape-type="button"]');
            if (!btn) return;
            if (btn.dataset.tabMode === 'true') {
                tabOverlay.classList.add('active');
                activeCanvas = tabCanvas;
            } else if (btn.dataset.link && !editMode) {
                window.open(btn.dataset.link, '_blank');
            }
        });

        let triggerBuffer = "";
        let resetTimer = null;
        let editMode = false;
        let selectedElement = null;
        let menuTarget = null; // the element currently open in the double-click menu
        const GRID_SIZE = 10;

        // ---------- Developer trigger / login (unchanged) ----------
        document.addEventListener('keydown', function(e) {
            if (typeof e.key === 'string' && e.key.length === 1) {
                triggerBuffer += e.key;

                if (resetTimer) clearTimeout(resetTimer);
                resetTimer = setTimeout(() => { triggerBuffer = ""; }, RESET_DELAY);

                if (triggerBuffer.length > TRIGGER_CODE.length) {
                    triggerBuffer = triggerBuffer.slice(-TRIGGER_CODE.length);
                }

                if (triggerBuffer.includes(TRIGGER_CODE)) {
                    showLoginPanel();
                    triggerBuffer = "";
                    if (resetTimer) clearTimeout(resetTimer);
                }
            }
        });

        function showLoginPanel() {
            loginOverlay.classList.add('active');
            usernameInput.focus();
            errorMessage.classList.remove('show');
            usernameInput.value = '';
            passwordInput.value = '';
        }

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (username === DEVELOPER_USERNAME && password === DEVELOPER_PASSWORD) {
                errorMessage.classList.remove('show');
                loginOverlay.classList.remove('active');
                developerBadge.classList.add('active');
                stagingMessage.classList.remove('show');
                heroSection.classList.remove('hidden');

                const sessionStartTime = Date.now();
                localStorage.setItem('developerSessionStart', sessionStartTime);
                startCountdownTimer();
                loginForm.reset();
            } else {
                errorMessage.classList.add('show');
                passwordInput.value = '';
                usernameInput.focus();
            }
        });

        badgeToggle.addEventListener('click', function() {
            developerPanel.classList.toggle('open');
            badgeToggle.textContent = developerPanel.classList.contains('open') ? '<' : '>';
        });

        closePanel.addEventListener('click', function() {
            developerPanel.classList.remove('open');
            badgeToggle.textContent = '>';
        });

        function startCountdownTimer() {
            const updateTimer = function() {
                const sessionStartTime = parseInt(localStorage.getItem('developerSessionStart'));
                const elapsedTime = Date.now() - sessionStartTime;
                const remainingTime = SESSION_DURATION - elapsedTime;

                if (remainingTime <= 0) {
                    developerBadge.classList.remove('active');
                    localStorage.removeItem('developerSessionStart');
                    timerDisplay.textContent = '00:00:00';
                    heroSection.classList.add('hidden');
                    stagingMessage.classList.add('show');
                    clearInterval(timerInterval);
                } else {
                    const hours = Math.floor(remainingTime / (1000 * 60 * 60));
                    const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);
                    timerDisplay.textContent =
                        String(hours).padStart(2, '0') + ':' +
                        String(minutes).padStart(2, '0') + ':' +
                        String(seconds).padStart(2, '0');
                }
            };
            updateTimer();
            const timerInterval = setInterval(updateTimer, 1000);
        }

        window.addEventListener('load', function() {
            const sessionStartTime = localStorage.getItem('developerSessionStart');
            if (sessionStartTime) {
                const sessionStart = parseInt(sessionStartTime);
                const elapsedTime = Date.now() - sessionStart;
                if (elapsedTime < SESSION_DURATION) {
                    developerBadge.classList.add('active');
                    stagingMessage.classList.remove('show');
                    heroSection.classList.remove('hidden');
                    startCountdownTimer();
                } else {
                    localStorage.removeItem('developerSessionStart');
                    stagingMessage.classList.add('show');
                    heroSection.classList.add('hidden');
                }
            } else {
                stagingMessage.classList.add('show');
                heroSection.classList.add('hidden');
            }
        });

        // ---------- Edit mode ----------
        editModeBtn.addEventListener('click', function() {
            editMode = true;
            activeCanvas = heroSection;
            heroSection.style.position = 'relative';
            heroSection.classList.add('edit-mode');
            editModeBtn.style.display = 'none';
            finishBtn.style.display = 'block';

            // .hero-content has no fixed size of its own - it was only ever sized by
            // its normal-flow children. The moment we make those children absolute,
            // hero-content collapses to 0x0 and re-centers (its parent uses
            // align-items/justify-content: center), which then shifts every child's
            // left/top out from under it. Taking hero-content out of the positioning
            // chain fixes that - heroSection (which never collapses) becomes the one
            // stable anchor for everything, same as your shapes already use.
            const heroContent = heroSection.querySelector('.hero-content');
            if (heroContent) heroContent.style.position = 'static';

            // Measure every text element's position BEFORE converting any of them.
            // Converting one removes it from the normal flow and shifts the layout,
            // which would throw off the measurement of every element after it if
            // done one at a time - that's what caused everything to pile up.
            const heroRect = heroSection.getBoundingClientRect();
            const texts = Array.from(document.querySelectorAll('.editable-text'));
            const measurements = texts.map(el => {
                if (el.classList.contains('editable-element')) return null;
                const elRect = el.getBoundingClientRect();
                return {
                    left: elRect.left - heroRect.left,
                    top: elRect.top - heroRect.top,
                    width: elRect.width,
                    height: elRect.height
                };
            });
            texts.forEach((el, i) => {
                if (measurements[i]) convertTextToPositioned(el, measurements[i]);
            });
        });

        // Turns a normal-flow text element into a positioned, resizable box - same
        // handles and drag behavior as a shape. Accepts a precomputed measurement so
        // callers can measure everything up front before converting any of it.
        function convertTextToPositioned(el, precomputed) {
            if (el.classList.contains('editable-element')) return; // already converted

            let left, top, width, height;
            if (precomputed) {
                ({ left, top, width, height } = precomputed);
            } else {
                const heroRect = heroSection.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                left = elRect.left - heroRect.left;
                top = elRect.top - heroRect.top;
                width = elRect.width;
                height = elRect.height;
            }

            el.classList.add('editable-element');
            el.dataset.shapeType = 'pageText';
            el.style.position = 'absolute';
            el.style.left = left + 'px';
            el.style.top = top + 'px';
            el.style.width = width + 'px';
            el.style.height = height + 'px';
            el.style.margin = '0';
            el.style.cursor = 'move';
            el.style.zIndex = el.style.zIndex || '10';

            ['tl', 'tr', 'bl', 'br'].forEach(pos => {
                const handle = document.createElement('div');
                handle.className = `resize-handle ${pos}`;
                el.appendChild(handle);
            });

            el.addEventListener('mousedown', selectElement);
        }

        document.querySelectorAll('.editable-text').forEach(el => {
            el.addEventListener('dblclick', function(e) {
                if (!editMode) return;
                e.stopPropagation();
                openElementMenu(el, e.clientX, e.clientY);
            });
            el.addEventListener('blur', function() {
                el.contentEditable = false;
            });
        });

        // ---------- Shapes ----------
        document.querySelectorAll('[data-shape]').forEach(btn => {
            btn.addEventListener('click', function() {
                if (!editMode) return;
                const shape = this.dataset.shape;
                createShape(shape);
            });
        });

        // Clicking empty space (not on a shape/text) deselects everything,
        // so resize handles only show for the element you're actually working on.
        heroSection.addEventListener('mousedown', function(e) {
            if (e.target === heroSection || e.target.classList.contains('hero-content')) {
                document.querySelectorAll('.editable-element').forEach(el => el.classList.remove('selected'));
            }
        });

        function createShape(type) {
            const element = document.createElement('div');
            element.className = 'editable-element selected';
            element.dataset.shapeType = type;
            element.style.left = '100px';
            element.style.top = '100px';
            element.style.width = '120px';
            element.style.height = '120px';
            element.style.backgroundColor = shapeColor.value;
            element.style.position = 'absolute';
            element.style.zIndex = '10';

            if (type === 'circle') {
                element.style.borderRadius = '50%';
            } else if (type === 'text') {
                element.textContent = 'Text';
                element.style.color = '#ffffff';
                element.style.display = 'flex';
                element.style.alignItems = 'center';
                element.style.justifyContent = 'center';
                element.style.fontSize = '14px';
                element.style.fontWeight = '600';
                // NOT contentEditable by default anymore - double-click > Edit Text turns it on
            } else if (type === 'button') {
                element.textContent = 'Button';
                element.style.cursor = 'pointer';
                element.style.display = 'flex';
                element.style.alignItems = 'center';
                element.style.justifyContent = 'center';
                element.style.color = '#0a0a0a';
                element.style.border = 'none';
                element.style.borderRadius = '6px';
                element.style.fontWeight = '600';
                element.style.fontSize = '14px';
            }

            ['tl', 'tr', 'bl', 'br'].forEach(pos => {
                const handle = document.createElement('div');
                handle.className = `resize-handle ${pos}`;
                element.appendChild(handle);
            });

            element.addEventListener('mousedown', selectElement);
            element.addEventListener('dblclick', function(e) {
                e.stopPropagation();
                openElementMenu(element, e.clientX, e.clientY);
            });
            element.addEventListener('blur', function() {
                element.contentEditable = false;
            });

            (activeCanvas || heroSection).appendChild(element);
            selectedElement = element;
        }

        function selectElement(e) {
            if (!editMode) return;

            const clickedElement = e.target.closest('.editable-element');
            if (!clickedElement) return;

            selectedElement = clickedElement;
            document.querySelectorAll('.editable-element').forEach(el => el.classList.remove('selected'));
            selectedElement.classList.add('selected');

            if (e.target.classList.contains('resize-handle')) {
                const startX = e.clientX;
                const startY = e.clientY;
                const startWidth = selectedElement.offsetWidth;
                const startHeight = selectedElement.offsetHeight;
                const pos = e.target.className.split(' ')[1];

                function onMouseMove(e) {
                    const deltaX = e.clientX - startX;
                    const deltaY = e.clientY - startY;

                    if (pos.includes('r')) {
                        let newWidth = startWidth + deltaX;
                        if (gridSnapToggle.checked) newWidth = Math.round(newWidth / GRID_SIZE) * GRID_SIZE;
                        selectedElement.style.width = Math.max(50, newWidth) + 'px';
                    }
                    if (pos.includes('b')) {
                        let newHeight = startHeight + deltaY;
                        if (gridSnapToggle.checked) newHeight = Math.round(newHeight / GRID_SIZE) * GRID_SIZE;
                        selectedElement.style.height = Math.max(50, newHeight) + 'px';
                    }
                }

                function onMouseUp() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                e.preventDefault();
            } else {
                const startX = e.clientX;
                const startY = e.clientY;
                const startLeft = selectedElement.offsetLeft;
                const startTop = selectedElement.offsetTop;

                function onMouseMove(e) {
                    let newLeft = startLeft + (e.clientX - startX);
                    let newTop = startTop + (e.clientY - startY);

                    if (gridSnapToggle.checked) {
                        newLeft = Math.round(newLeft / GRID_SIZE) * GRID_SIZE;
                        newTop = Math.round(newTop / GRID_SIZE) * GRID_SIZE;
                    }

                    selectedElement.style.left = newLeft + 'px';
                    selectedElement.style.top = newTop + 'px';
                }

                function onMouseUp() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                e.preventDefault();
            }
        }

        // ---------- Double-click element menu (Edit / Delete / Transparency / Image / Font / Color / Layer) ----------
        let uploadTarget = null; // survives the menu closing while the native file picker is open

        function rgbToHex(rgbStr) {
            const nums = rgbStr.match(/\d+/g);
            if (!nums) return '#ffffff';
            return '#' + nums.slice(0, 3).map(n => parseInt(n, 10).toString(16).padStart(2, '0')).join('');
        }

        function closeElementMenu() {
            elementMenu.classList.remove('active');
            elementMenu.innerHTML = '';
            menuTarget = null;
        }

        function openElementMenu(target, x, y) {
            menuTarget = target;
            const isPageText = target.classList.contains('editable-text');
            const type = isPageText ? 'text' : (target.dataset.shapeType || 'shape');
            const hasText = isPageText || type === 'text' || type === 'button';
            const currentOpacity = target.style.opacity !== '' ? parseFloat(target.style.opacity) : 1;
            const sliderValue = (1 - currentOpacity).toFixed(2);
            const currentFontSize = parseInt(getComputedStyle(target).fontSize, 10) || 16;
            const currentColor = rgbToHex(getComputedStyle(target).color);
            const currentRadius = parseFloat(getComputedStyle(target).borderRadius) || 0;

            let html = `<div class="element-menu-title">${type}</div>`;
            if (hasText) {
                html += `<button type="button" data-action="edit">Edit Text</button>`;
                html += `
                    <div class="transparency-row">
                        <label>Font Size</label>
                        <input type="range" min="10" max="96" step="1" value="${currentFontSize}" data-action="fontsize">
                    </div>
                    <div class="transparency-row">
                        <label>Text Color</label>
                        <input type="color" value="${currentColor}" data-action="color">
                    </div>
                `;
            }
            if (type !== 'circle') {
                html += `
                    <div class="transparency-row">
                        <label>Corner Radius (px)</label>
                        <input type="number" min="0" max="100" step="1" value="${Math.round(currentRadius)}" data-action="radius">
                    </div>
                `;
            }
            if (type === 'button') {
                const currentLink = target.dataset.link || '';
                const isTabMode = target.dataset.tabMode === 'true';
                html += `
                    <div class="transparency-row">
                        <label>Insert Link</label>
                        <input type="text" placeholder="https://..." value="${currentLink}" data-action="link">
                    </div>
                    <button type="button" data-action="removelink">Remove Link</button>
                    <div class="panel-section" style="gap:8px;">
                        <label style="font-size:0.7rem;">New Tab Button</label>
                        <div class="toggle-switch">
                            <label class="switch">
                                <input type="checkbox" data-action="tabmode" ${isTabMode ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                `;
            }
            html += `
                <button type="button" data-action="image">Upload Image</button>
                <div class="transparency-row">
                    <label>Transparency</label>
                    <input type="range" min="0" max="1" step="0.01" value="${sliderValue}" data-action="opacity">
                </div>
            `;
            if (!isPageText) {
                const currentBgAlpha = getComputedStyle(target).backgroundColor.match(/[\d.]+/g);
                const bgAlpha = currentBgAlpha && currentBgAlpha[3] !== undefined ? parseFloat(currentBgAlpha[3]) : 1;
                html += `
                    <div class="transparency-row">
                        <label>Background Transparency</label>
                        <input type="range" min="0" max="1" step="0.01" value="${(1 - bgAlpha).toFixed(2)}" data-action="bgopacity">
                    </div>
                `;
            }
            html += `
                <div class="layer-row">
                    <button type="button" data-action="forward">Forward</button>
                    <button type="button" data-action="backward">Backward</button>
                </div>
                <button type="button" data-action="delete" class="danger">Delete</button>
                <button type="button" data-action="done" class="done-btn">Done</button>
            `;
            elementMenu.innerHTML = html;

            // Keep menu on screen
            const menuWidth = 230;
            const menuHeight = 460;
            elementMenu.style.left = Math.min(x, window.innerWidth - menuWidth) + 'px';
            elementMenu.style.top = Math.min(y, window.innerHeight - menuHeight) + 'px';
            elementMenu.classList.add('active');
        }

        elementMenu.addEventListener('click', function(e) {
            const btn = e.target.closest('button');
            if (!btn || !menuTarget) return;
            const action = btn.dataset.action;

            if (action === 'edit') {
                menuTarget.contentEditable = true;
                menuTarget.focus();
                closeElementMenu();
            } else if (action === 'delete') {
                menuTarget.remove();
                closeElementMenu();
            } else if (action === 'image') {
                // Save the target separately: the native file picker's click bubbles to
                // document and would otherwise trigger the "click outside closes menu"
                // handler below, wiping menuTarget before a file is even chosen.
                uploadTarget = menuTarget;
                elementImageInput.click();
            } else if (action === 'forward') {
                const z = parseInt(menuTarget.style.zIndex || '10', 10);
                menuTarget.style.zIndex = (z + 1).toString();
            } else if (action === 'backward') {
                const z = parseInt(menuTarget.style.zIndex || '10', 10);
                menuTarget.style.zIndex = Math.max(1, z - 1).toString();
            } else if (action === 'removelink') {
                delete menuTarget.dataset.link;
                const linkInput = elementMenu.querySelector('[data-action="link"]');
                if (linkInput) linkInput.value = '';
            } else if (action === 'done') {
                closeElementMenu();
            }
        });

        elementMenu.addEventListener('change', function(e) {
            if (!menuTarget) return;
            if (e.target.dataset.action === 'tabmode') {
                menuTarget.dataset.tabMode = e.target.checked ? 'true' : 'false';
            }
        });

        elementMenu.addEventListener('input', function(e) {
            if (!menuTarget) return;
            const action = e.target.dataset.action;
            if (action === 'opacity') {
                // 1 on the slider = fully disappeared, 0 = fully visible
                const v = parseFloat(e.target.value);
                menuTarget.style.opacity = (1 - v).toString();
            } else if (action === 'fontsize') {
                menuTarget.style.fontSize = e.target.value + 'px';
            } else if (action === 'color') {
                menuTarget.style.color = e.target.value;
            } else if (action === 'radius') {
                const px = parseFloat(e.target.value);
                menuTarget.style.borderRadius = (isNaN(px) ? 0 : px) + 'px';
            } else if (action === 'link') {
                menuTarget.dataset.link = e.target.value;
            } else if (action === 'bgopacity') {
                // Fades only the fill color's alpha - text and border stay fully visible.
                // 1 on the slider = background fully disappears, 0 = fully solid.
                const v = parseFloat(e.target.value);
                const alpha = 1 - v;
                const current = getComputedStyle(menuTarget).backgroundColor;
                const nums = current.match(/[\d.]+/g);
                if (nums) {
                    menuTarget.style.backgroundColor = `rgba(${nums[0]}, ${nums[1]}, ${nums[2]}, ${alpha})`;
                }
            }
        });

        elementImageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            const target = uploadTarget;
            if (file && target) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    target.style.backgroundImage = `url(${event.target.result})`;
                    target.style.backgroundSize = 'cover';
                    target.style.backgroundPosition = 'center';
                };
                reader.readAsDataURL(file);
            }
            elementImageInput.value = '';
            uploadTarget = null;
        });

        // Click anywhere outside the menu closes it
        document.addEventListener('click', function(e) {
            if (e.target === elementImageInput) return; // the hidden file input's own click, ignore
            if (elementMenu.classList.contains('active') &&
                !elementMenu.contains(e.target) &&
                e.target !== menuTarget) {
                closeElementMenu();
            }
        });

        // ---------- Finish / export ----------
        finishBtn.addEventListener('click', function() {
            editMode = false;
            heroSection.classList.remove('edit-mode');
            closeElementMenu();

            document.querySelectorAll('.editable-text').forEach(el => {
                el.contentEditable = false;
            });

            document.querySelectorAll('.editable-element').forEach(el => {
                el.classList.remove('selected');
                el.contentEditable = false;
            });

            editModeBtn.style.display = 'block';
            finishBtn.style.display = 'none';

            const htmlCode = heroSection.innerHTML;
            codeDisplay.textContent = htmlCode;
            codeModal.classList.add('active');
        });

        closeCode.addEventListener('click', function() {
            codeModal.classList.remove('active');
        });

        copyCodeBtn.addEventListener('click', function() {
            const code = codeDisplay.textContent;
            navigator.clipboard.writeText(code).then(() => {
                copyCodeBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyCodeBtn.textContent = 'Copy Code';
                }, 2000);
            });
        });
    </script>

</body>
</html>
