<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyPathz</title>
    <style>
        /* Reset margins and set the dark, purple-themed background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0614; /* Deep dark purple/black background */
            color: #ffffff;
            text-align: center;
        }

        /* The main container with your purple digital grid style background */
        .hero-section {
            background: linear-gradient(rgba(13, 6, 20, 0.4), rgba(13, 6, 20, 0.9)), 
                        url('https://transparenttextures.com'), 
                        #2b0d47; /* Grid pattern texture combined with purple */
            background-size: auto;
            padding: 80px 20px;
            border-bottom: 3px solid #4a157d;
        }

        /* Styling for the text elements exactly like your reference image */
        .countdown {
            color: #a855f7;
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 5rem;
            font-weight: 300;
            margin: 0 0 30px 0;
            letter-spacing: 2px;
        }

        .announcement {
            font-size: 1.8rem;
            font-weight: 300;
            color: #e2e8f0;
            max-width: 800px;
            margin: 0 auto 40px auto;
            line-height: 1.4;
        }

        .sub-time {
            font-size: 1.5rem;
            color: #a855f7;
            font-weight: bold;
        }

        /* Lower section for the main header */
        .footer-heading {
            margin-top: 60px;
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="countdown">24Hr left</div>
        <h1 class="main-title">hi</h1>
        <p class="announcement">tomorrow there will be an improved app and version</p>
        <div class="sub-time">24Hr</div>
    </div>

    <h2 class="footer-heading">Proxy website</h2>

</body>
</html>
