<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyPathz</title>
    <style>
        /* Reset margins and set the dark, purple-themed background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0614; /* Deep dark purple/black background */
            color: #ffffff;
            text-align: center;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Decorative dots background (starfield) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #a855f7, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 60px 70px, #c084fc, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 50px, #a855f7, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #c084fc, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 10px, #a855f7, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.8;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        /* Developer Badge */
        .developer-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #4a157d 0%, #6b21a8 100%);
            border: 2px solid #a855f7;
            color: #a855f7;
            padding: 15px 25px;
            border-radius: 8px;
            display: none;
            z-index: 900;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            font-weight: bold;
            align-items: center;
            gap: 15px;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
            cursor: pointer;
        }

        .developer-badge.active {
            display: flex;
        }

        .badge-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer-display {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ff6b6b;
            min-width: 60px;
        }

        .badge-toggle {
            cursor: pointer;
            font-size: 1.2rem;
            user-select: none;
        }

        /* Developer Panel */
        .developer-panel {
            position: fixed;
            top: 100px;
            right: -400px;
            width: 400px;
            height: calc(100vh - 120px);
            background: linear-gradient(135deg, #4a157d 0%, #2d0a4e 100%);
            border: 2px solid #a855f7;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
            z-index: 900;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .developer-panel.open {
            right: 20px;
        }

        .panel-header {
            padding: 15px;
            border-bottom: 2px solid #a855f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            margin: 0;
            color: #a855f7;
            font-size: 1.2rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: #a855f7;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 5px;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-section label {
            color: #a855f7;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2d0a4e;
            transition: 0.4s;
            border-radius: 24px;
            border: 1px solid #a855f7;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #a855f7;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #a855f7;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
            background-color: #2d0a4e;
        }

        .shape-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .shape-btn {
            padding: 10px;
            background: linear-gradient(135deg, #6b21a8 0%, #7e22ce 100%);
            border: 1px solid #a855f7;
            color: #a855f7;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .shape-btn:hover {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }

        .color-picker-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .color-picker-group input[type="color"] {
            width: 50px;
            height: 40px;
            border: 1px solid #a855f7;
            border-radius: 5px;
            cursor: pointer;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 10px;
            background: linear-gradient(135deg, #6b21a8 0%, #7e22ce 100%);
            border: 1px solid #a855f7;
            color: #a855f7;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
        }

        .file-input-label:hover {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }

        .edit-button, .finish-button, .copy-button {
            padding: 12px;
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            border: 1px solid #a855f7;
            color: #2d0a4e;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            margin-top: auto;
        }

        .edit-button:hover, .finish-button:hover, .copy-button:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
            transform: translateY(-2px);
        }

        /* Edit Mode */
        .edit-mode {
            position: relative;
        }

        .edit-mode .editable-text {
            border: 2px dashed #a855f7;
            padding: 5px;
            cursor: text;
        }

        .editable-element {
            position: absolute;
            border: 2px dashed #a855f7;
            cursor: move;
            touch-action: none;
            box-sizing: border-box;
        }

        .editable-element.selected {
            border: 2px solid #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
        }

        .resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #a855f7;
            border: 1px solid #2d0a4e;
            border-radius: 50%;
            cursor: nwse-resize;
        }

        .resize-handle.tl { top: -5px; left: -5px; cursor: nw-resize; }
        .resize-handle.tr { top: -5px; right: -5px; cursor: ne-resize; }
        .resize-handle.bl { bottom: -5px; left: -5px; cursor: sw-resize; }
        .resize-handle.br { bottom: -5px; right: -5px; cursor: se-resize; }

        /* Code Modal */
        .code-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .code-modal.active {
            display: flex;
        }

        .code-container {
            background: #1a0033;
            border: 2px solid #a855f7;
            border-radius: 8px;
            max-width: 900px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.6);
        }

        .code-header {
            padding: 15px;
            border-bottom: 2px solid #a855f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-header h3 {
            color: #a855f7;
            margin: 0;
        }

        .code-close {
            background: none;
            border: none;
            color: #a855f7;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .code-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .code-display {
            background: #0d0614;
            border: 1px solid #a855f7;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            color: #a855f7;
            font-size: 0.85rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 100%;
            overflow-y: auto;
        }

        .code-footer {
            padding: 15px;
            border-top: 2px solid #a855f7;
            display: flex;
            gap: 10px;
        }

        .copy-button {
            flex: 1;
            margin: 0;
        }

        /* Login Panel */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .login-overlay.active {
            display: flex;
            opacity: 1;
        }

        .login-panel {
            background: linear-gradient(135deg, #4a157d 0%, #6b21a8 100%);
            border: 2px solid #a855f7;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
            width: 90%;
            max-width: 400px;
            transform: translateY(100vh);
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes slideUp {
            0% {
                transform: translateY(100vh);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-panel h2 {
            color: #a855f7;
            margin-top: 0;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .form-group {
            margin: 20px 0;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #b0bec5;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #a855f7;
            background-color: rgba(13, 6, 20, 0.8);
            color: #a855f7;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
            border-color: #c084fc;
        }

        .form-group input::placeholder {
            color: #a855f7;
            opacity: 0.5;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            color: #2d0a4e;
            border: 1px solid #a855f7;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
        }

        .login-button:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .error-message.show {
            display: block;
        }

        /* Hero Section */
        .hero-section {
            background: linear-gradient(rgba(13, 6, 20, 0.4), rgba(13, 6, 20, 0.9)), 
                        #2b0d47;
            background-size: auto;
            padding: 80px 20px;
            border-bottom: 3px solid #a855f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .countdown {
            color: #a855f7;
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
        }

        .main-title {
            font-size: 5rem;
            font-weight: 300;
            margin: 0 0 30px 0;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }

        .announcement {
            font-size: 1.8rem;
            font-weight: 300;
            color: #e2e8f0;
            max-width: 800px;
            margin: 0 auto 40px auto;
            line-height: 1.4;
        }

        .sub-time {
            font-size: 1.5rem;
            color: #a855f7;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .footer-heading {
            margin-top: 60px;
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #a855f7;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            padding: 20px;
        }

        .footer-heading::before {
            content: '◆ ';
            font-size: 0.8em;
            color: #c084fc;
        }

        .footer-heading::after {
            content: ' ◆';
            font-size: 0.8em;
            color: #c084fc;
        }
    </style>
</head>
<body>

    <!-- Developer Badge -->
    <div class="developer-badge" id="developerBadge">
        <span class="badge-label">🔐 DEVELOPER</span>
        <span class="timer-display" id="timerDisplay">10:00:00</span>
        <span class="badge-toggle" id="badgeToggle">></span>
    </div>

    <!-- Developer Panel -->
    <div class="developer-panel" id="developerPanel">
        <div class="panel-header">
            <h2>Edit Tools</h2>
            <button class="close-btn" id="closePanel">×</button>
        </div>
        <div class="panel-content">
            <div class="panel-section">
                <label>Grid Snap</label>
                <div class="toggle-switch">
                    <label class="switch">
                        <input type="checkbox" id="gridSnapToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="panel-section">
                <label>Add Shape</label>
                <div class="shape-grid">
                    <button class="shape-btn" data-shape="rectangle">Rectangle</button>
                    <button class="shape-btn" data-shape="circle">Circle</button>
                    <button class="shape-btn" data-shape="text">Text Box</button>
                    <button class="shape-btn" data-shape="button">Button</button>
                </div>
            </div>

            <div class="panel-section">
                <label>Shape Color</label>
                <div class="color-picker-group">
                    <input type="color" id="shapeColor" value="#a855f7">
                </div>
            </div>

            <div class="panel-section">
                <label>Button Image</label>
                <div class="file-input-wrapper">
                    <input type="file" id="imageInput" accept="image/*">
                    <label for="imageInput" class="file-input-label">Upload Image</label>
                </div>
            </div>

            <button class="edit-button" id="editModeBtn">Enter Edit Mode</button>
            <button class="finish-button" id="finishBtn" style="display: none;">Finish Editing</button>
        </div>
    </div>

    <!-- Code Modal -->
    <div class="code-modal" id="codeModal">
        <div class="code-container">
            <div class="code-header">
                <h3>Updated HTML Code</h3>
                <button class="code-close" id="closeCode">×</button>
            </div>
            <div class="code-content">
                <div class="code-display" id="codeDisplay"></div>
            </div>
            <div class="code-footer">
                <button class="copy-button" id="copyCodeBtn">Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <!-- Login Panel Overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-panel" style="position: relative;">
            <h2>Developer Access</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="login-button">Login</button>
                <div class="error-message" id="errorMessage">Invalid credentials</div>
            </form>
        </div>
    </div>

    <div class="hero-section" id="heroSection">
        <div class="countdown editable-text" contenteditable="false">24Hr left</div>
        <h1 class="main-title editable-text" contenteditable="false">hi</h1>
        <p class="announcement editable-text" contenteditable="false">tomorrow there will be an improved app and version</p>
        <div class="sub-time editable-text" contenteditable="false">24Hr</div>
        <h2 class="footer-heading editable-text" contenteditable="false">Proxy website</h2>
    </div>

    <script>
        // Developer access trigger and credentials
        const TRIGGER_CODE = "1991";
        const DEVELOPER_USERNAME = "X4ZQ3";
        const DEVELOPER_PASSWORD = "beta tester";
        const SESSION_DURATION = 10 * 60 * 60 * 1000;
        const RESET_DELAY = 5000; // 5 seconds

        // DOM Elements
        const loginOverlay = document.getElementById('loginOverlay');
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const developerBadge = document.getElementById('developerBadge');
        const timerDisplay = document.getElementById('timerDisplay');
        const badgeToggle = document.getElementById('badgeToggle');
        const developerPanel = document.getElementById('developerPanel');
        const closePanel = document.getElementById('closePanel');
        const editModeBtn = document.getElementById('editModeBtn');
        const finishBtn = document.getElementById('finishBtn');
        const heroSection = document.getElementById('heroSection');
        const codeModal = document.getElementById('codeModal');
        const codeDisplay = document.getElementById('codeDisplay');
        const closeCode = document.getElementById('closeCode');
        const copyCodeBtn = document.getElementById('copyCodeBtn');
        const gridSnapToggle = document.getElementById('gridSnapToggle');
        const shapeColor = document.getElementById('shapeColor');
        const imageInput = document.getElementById('imageInput');

        let triggerBuffer = "";
        let resetTimer = null;
        let editMode = false;
        let selectedElement = null;
        let draggedElement = null;
        let uploadedImage = null;
        const GRID_SIZE = 10;

        // Trigger code detection with 5-second reset delay
        document.addEventListener('keydown', function(e) {
            if (e.key.length === 1) {
                triggerBuffer += e.key;
                
                // Clear existing reset timer
                if (resetTimer) {
                    clearTimeout(resetTimer);
                }

                // Set new reset timer for 5 seconds
                resetTimer = setTimeout(() => {
                    triggerBuffer = "";
                }, RESET_DELAY);

                // Keep buffer at reasonable size
                if (triggerBuffer.length > TRIGGER_CODE.length) {
                    triggerBuffer = triggerBuffer.slice(-TRIGGER_CODE.length);
                }

                // Check if trigger code was typed
                if (triggerBuffer.includes(TRIGGER_CODE)) {
                    showLoginPanel();
                    triggerBuffer = "";
                    if (resetTimer) {
                        clearTimeout(resetTimer);
                    }
                }
            }
        });

        function showLoginPanel() {
            loginOverlay.classList.add('active');
            usernameInput.focus();
            errorMessage.classList.remove('show');
            usernameInput.value = '';
            passwordInput.value = '';
        }

        // Login form submission
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (username === DEVELOPER_USERNAME && password === DEVELOPER_PASSWORD) {
                errorMessage.classList.remove('show');
                loginOverlay.classList.remove('active');
                developerBadge.classList.add('active');
                const sessionStartTime = Date.now();
                localStorage.setItem('developerSessionStart', sessionStartTime);
                startCountdownTimer();
                loginForm.reset();
            } else {
                errorMessage.classList.add('show');
                passwordInput.value = '';
                usernameInput.focus();
            }
        });

        // Badge toggle panel
        badgeToggle.addEventListener('click', function() {
            developerPanel.classList.toggle('open');
            badgeToggle.textContent = developerPanel.classList.contains('open') ? '<' : '>';
        });

        // Close panel
        closePanel.addEventListener('click', function() {
            developerPanel.classList.remove('open');
            badgeToggle.textContent = '>';
        });

        // Timer
        function startCountdownTimer() {
            const updateTimer = function() {
                const sessionStartTime = parseInt(localStorage.getItem('developerSessionStart'));
                const elapsedTime = Date.now() - sessionStartTime;
                const remainingTime = SESSION_DURATION - elapsedTime;

                if (remainingTime <= 0) {
                    developerBadge.classList.remove('active');
                    localStorage.removeItem('developerSessionStart');
                    timerDisplay.textContent = '00:00:00';
                    clearInterval(timerInterval);
                } else {
                    const hours = Math.floor(remainingTime / (1000 * 60 * 60));
                    const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);
                    timerDisplay.textContent = 
                        String(hours).padStart(2, '0') + ':' + 
                        String(minutes).padStart(2, '0') + ':' + 
                        String(seconds).padStart(2, '0');
                }
            };
            updateTimer();
            const timerInterval = setInterval(updateTimer, 1000);
        }

        // Check session on load
        window.addEventListener('load', function() {
            const sessionStartTime = localStorage.getItem('developerSessionStart');
            if (sessionStartTime) {
                const sessionStart = parseInt(sessionStartTime);
                const elapsedTime = Date.now() - sessionStart;
                if (elapsedTime < SESSION_DURATION) {
                    developerBadge.classList.add('active');
                    startCountdownTimer();
                } else {
                    localStorage.removeItem('developerSessionStart');
                }
            }
        });

        // Edit Mode
        editModeBtn.addEventListener('click', function() {
            editMode = true;
            heroSection.style.position = 'relative';
            heroSection.classList.add('edit-mode');
            
            // Enable editing of existing text
            document.querySelectorAll('.editable-text').forEach(el => {
                el.contentEditable = true;
            });
            
            editModeBtn.style.display = 'none';
            finishBtn.style.display = 'block';
        });

        // Shape buttons
        document.querySelectorAll('[data-shape]').forEach(btn => {
            btn.addEventListener('click', function() {
                if (!editMode) return;
                const shape = this.dataset.shape;
                createShape(shape);
            });
        });

        function createShape(type) {
            const element = document.createElement('div');
            element.className = 'editable-element selected';
            element.style.left = '100px';
            element.style.top = '100px';
            element.style.width = '100px';
            element.style.height = '100px';
            element.style.backgroundColor = shapeColor.value;
            element.style.position = 'absolute';
            element.style.zIndex = '10';

            if (type === 'circle') {
                element.style.borderRadius = '50%';
            } else if (type === 'text') {
                element.textContent = 'Click to edit';
                element.style.color = '#ffffff';
                element.style.display = 'flex';
                element.style.alignItems = 'center';
                element.style.justifyContent = 'center';
                element.style.fontSize = '14px';
                element.contentEditable = true;
            } else if (type === 'button') {
                element.textContent = 'Button';
                element.style.cursor = 'pointer';
                element.style.display = 'flex';
                element.style.alignItems = 'center';
                element.style.justifyContent = 'center';
                element.style.color = '#fff';
                element.style.border = 'none';
                element.style.borderRadius = '5px';
                element.style.fontWeight = 'bold';
                if (uploadedImage) {
                    element.style.backgroundImage = `url(${uploadedImage})`;
                    element.style.backgroundSize = 'cover';
                }
            }

            // Add resize handles
            ['tl', 'tr', 'bl', 'br'].forEach(pos => {
                const handle = document.createElement('div');
                handle.className = `resize-handle ${pos}`;
                element.appendChild(handle);
            });

            element.addEventListener('mousedown', selectElement);
            heroSection.appendChild(element);
            selectedElement = element;
        }

        function selectElement(e) {
            if (!editMode) return;
            
            const clickedElement = e.target.closest('.editable-element');
            if (!clickedElement) return;
            
            selectedElement = clickedElement;
            document.querySelectorAll('.editable-element').forEach(el => el.classList.remove('selected'));
            selectedElement.classList.add('selected');

            if (e.target.classList.contains('resize-handle')) {
                const startX = e.clientX;
                const startY = e.clientY;
                const startWidth = selectedElement.offsetWidth;
                const startHeight = selectedElement.offsetHeight;
                const pos = e.target.className.split(' ')[1];

                function onMouseMove(e) {
                    const deltaX = e.clientX - startX;
                    const deltaY = e.clientY - startY;

                    if (pos.includes('r')) {
                        let newWidth = startWidth + deltaX;
                        if (gridSnapToggle.checked) newWidth = Math.round(newWidth / GRID_SIZE) * GRID_SIZE;
                        selectedElement.style.width = Math.max(50, newWidth) + 'px';
                    }
                    if (pos.includes('b')) {
                        let newHeight = startHeight + deltaY;
                        if (gridSnapToggle.checked) newHeight = Math.round(newHeight / GRID_SIZE) * GRID_SIZE;
                        selectedElement.style.height = Math.max(50, newHeight) + 'px';
                    }
                }

                function onMouseUp() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                e.preventDefault();
            } else {
                const startX = e.clientX;
                const startY = e.clientY;
                const startLeft = selectedElement.offsetLeft;
                const startTop = selectedElement.offsetTop;

                function onMouseMove(e) {
                    let newLeft = startLeft + (e.clientX - startX);
                    let newTop = startTop + (e.clientY - startY);

                    if (gridSnapToggle.checked) {
                        newLeft = Math.round(newLeft / GRID_SIZE) * GRID_SIZE;
                        newTop = Math.round(newTop / GRID_SIZE) * GRID_SIZE;
                    }

                    selectedElement.style.left = newLeft + 'px';
                    selectedElement.style.top = newTop + 'px';
                }

                function onMouseUp() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
                e.preventDefault();
            }
        }

        // Image upload
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImage = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Finish editing
        finishBtn.addEventListener('click', function() {
            editMode = false;
            heroSection.classList.remove('edit-mode');
            
            // Disable editing of text
            document.querySelectorAll('.editable-text').forEach(el => {
                el.contentEditable = false;
            });
            
            document.querySelectorAll('.editable-element').forEach(el => {
                el.classList.remove('selected');
            });
            
            editModeBtn.style.display = 'block';
            finishBtn.style.display = 'none';

            // Generate HTML code
            const htmlCode = heroSection.innerHTML;
            codeDisplay.textContent = htmlCode;
            codeModal.classList.add('active');
        });

        // Code modal close
        closeCode.addEventListener('click', function() {
            codeModal.classList.remove('active');
        });

        // Copy code
        copyCodeBtn.addEventListener('click', function() {
            const code = codeDisplay.textContent;
            navigator.clipboard.writeText(code).then(() => {
                copyCodeBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyCodeBtn.textContent = 'Copy to Clipboard';
                }, 2000);
            });
        });
    </script>

</body>
</html>
